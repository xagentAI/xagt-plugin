name: Seal accepted submission before reward

on:
  workflow_dispatch:
    inputs:
      submission_slug:
        description: Directory name under submissions/mcp-hackathon/
        required: true
        type: string
      pull_request_number:
        description: Merged submission pull request number
        required: true
        type: string
      reviewer:
        description: Accountable X-Agent reviewer or review group
        required: true
        type: string
      review_record_url:
        description: URL of the final review decision
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: submission-seal-${{ inputs.submission_slug }}
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == 'xagentAI/xagt-plugin' && github.ref == 'refs/heads/main'
    name: Validate, archive, hash, and publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact official release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Require repository release immutability
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          enabled="$(gh api "repos/${REPOSITORY}/immutable-releases" --jq '.enabled')"
          test "$enabled" = "true"

      - name: Verify merged source against the official archive and live service
        env:
          SLUG: ${{ inputs.submission_slug }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWER: ${{ inputs.reviewer }}
          REVIEW_RECORD_URL: ${{ inputs.review_record_url }}
        run: node scripts/submission-lifecycle.mjs seal

      - name: Build source archive without executing submission code
        env:
          SLUG: ${{ inputs.submission_slug }}
        run: |
          directory="submissions/mcp-hackathon/$SLUG"
          review_commit="$(jq -r '.reviewCommit' "$RUNNER_TEMP/xagt-acceptance.json")"
          archive="$RUNNER_TEMP/${SLUG}-source.tar.gz"
          receipt="$RUNNER_TEMP/${SLUG}-acceptance.json"
          tar --create --gzip --file "$archive" "$directory"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          jq --arg hash "$archive_sha256" '. + {sourceArchiveSha256: $hash}' "$RUNNER_TEMP/xagt-acceptance.json" > "$receipt"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "RECEIPT=$receipt" >> "$GITHUB_ENV"
          echo "REVIEW_COMMIT=$review_commit" >> "$GITHUB_ENV"

      - name: Publish the permanent acceptance release
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.submission_slug }}
        run: |
          tag="submission-${SLUG}-${REVIEW_COMMIT:0:12}"
          gh release create "$tag" \
            "$ARCHIVE#Complete accepted source" \
            "$RECEIPT#Acceptance and integrity receipt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Accepted submission: $SLUG" \
            --notes "Manually sealed by X-Agent after a recorded review decision. Sealing does not issue a reward. Corrections require a new additive release; this release is never replaced."
