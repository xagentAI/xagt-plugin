name: Validate hackathon submission

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "submissions/mcp-hackathon/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: submission-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source, commit, and deployment proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted base-branch validator only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Read and validate submission files without executing them
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/scripts/submission-lifecycle.mjs validate
