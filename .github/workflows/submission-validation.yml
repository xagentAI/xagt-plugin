name: Validate hackathon submission

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "submissions/mcp-hackathon/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Source, commit, and deployment proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted validator from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the untrusted submission without credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the trusted base commit for scope comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: git -C candidate fetch --no-tags --depth=1 "https://github.com/${BASE_REPOSITORY}.git" "$BASE_SHA"

      - name: Validate changed scope, source package, commit, and live deployment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          XAGT_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node trusted/scripts/validate-submission.mjs
          --repo-root candidate
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --online

  archive:
    name: Preserve validated PR commit in the official repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the official repository with write access
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Copy the validated fork commit into a unique official archive ref
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          short_sha="${HEAD_SHA:0:12}"
          archive_ref="refs/heads/submission-archive/pr-${PR_NUMBER}-${short_sha}"
          git fetch --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "$HEAD_SHA"
          git push origin "$HEAD_SHA:$archive_ref"
