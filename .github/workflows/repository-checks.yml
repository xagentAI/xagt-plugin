name: Repository CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out package code without submitted projects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Submissions are review artifacts and must never execute in package CI.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/submissions/

      - name: Verify submitted projects are absent
        run: test ! -e submissions && test ! -L submissions

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check known dependency advisories
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Test package code
        run: npm test

      - name: Build
        run: npm run build
