openapi: 3.1.0
info:
  title: BountyLens API
  version: 0.1.0
  description: >-
    Evidence-linked evaluation of public GitHub Issues for developers and coding agents.
    BountyLens reads public metadata, returns deterministic scores, and never executes the
    target repository.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Evaluation
  - name: Examples
  - name: Status
paths:
  /v1/evaluate:
    post:
      tags: [Evaluation]
      operationId: evaluateIssue
      summary: Evaluate a public GitHub Issue
      description: >-
        Reads public GitHub data, extracts evidence, and returns a deterministic opportunity
        score. The JSON request body is limited to 16 KiB. This operation does not execute
        repository code or modify GitHub.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
            examples:
              withProfile:
                summary: Evaluate with a developer profile
                value:
                  issue_url: https://github.com/fastify/fastify/issues/7030
                  developer_profile:
                    languages: [JavaScript, TypeScript]
                    hourly_rate_usd: 30
                    max_hours: 24
              issueOnly:
                summary: Evaluate without personalization
                value:
                  issue_url: https://github.com/fastify/fastify/issues/7030
      responses:
        "200":
          description: Evaluation completed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
              examples:
                publicIssue:
                  $ref: "#/components/examples/EvaluateSuccess"
        "400":
          description: Invalid JSON, request schema, or GitHub Issue URL
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRequest:
                  $ref: "#/components/examples/InvalidRequest"
                invalidIssueUrl:
                  $ref: "#/components/examples/InvalidIssueUrl"
        "404":
          description: The GitHub Issue is unavailable or private
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                issueNotFound:
                  $ref: "#/components/examples/IssueNotFound"
        "413":
          description: Request body exceeds 16 KiB
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestTooLarge:
                  $ref: "#/components/examples/RequestTooLarge"
        "429":
          description: GitHub rate limit reached
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              description: Suggested retry delay when GitHub supplies one.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimited:
                  $ref: "#/components/examples/RateLimited"
        "500":
          description: Evaluation failed without exposing internal details
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                evaluationFailed:
                  $ref: "#/components/examples/EvaluationFailed"
        "504":
          description: GitHub did not respond before the configured timeout
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                upstreamTimeout:
                  $ref: "#/components/examples/UpstreamTimeout"
  /v1/examples/{exampleId}:
    get:
      tags: [Examples]
      operationId: getEvaluationExample
      summary: Return a deterministic offline evaluation example
      description: Returns a static example without accessing GitHub.
      parameters:
        - name: exampleId
          in: path
          required: true
          schema:
            type: string
            enum:
              - clear-reward-low-competition
              - clear-reward-high-competition
              - no-explicit-reward
      responses:
        "200":
          description: Example returned
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
              examples:
                lowCompetition:
                  $ref: "#/components/examples/EvaluateSuccess"
        "404":
          description: Example ID is unknown
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                exampleNotFound:
                  $ref: "#/components/examples/ExampleNotFound"
  /health:
    get:
      tags: [Status]
      operationId: getHealth
      summary: Check service liveness and source commit
      responses:
        "200":
          description: Service is healthy
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                commit: 0123456789abcdef0123456789abcdef01234567
  /.well-known/xagent-verification.json:
    get:
      tags: [Status]
      operationId: getXAgentVerification
      summary: Bind the deployment to the reviewed source commit
      responses:
        "200":
          description: Deployment proof returned
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponse"
              example:
                schemaVersion: 1
                slug: bountylens
                commit: 0123456789abcdef0123456789abcdef01234567
components:
  headers:
    RequestId:
      description: Correlation ID generated for this HTTP request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    DeveloperProfile:
      type: object
      additionalProperties: false
      properties:
        languages:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
        hourly_rate_usd:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
        max_hours:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [issue_url]
      properties:
        issue_url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
          description: Public URL in the form https://github.com/{owner}/{repo}/issues/{number}.
        developer_profile:
          $ref: "#/components/schemas/DeveloperProfile"
    IssueSummary:
      type: object
      additionalProperties: false
      required: [url, repository, number, state]
      properties:
        url:
          type: string
          format: uri
        repository:
          type: string
          minLength: 1
        number:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [open, closed]
    EstimatedEffort:
      type: object
      additionalProperties: false
      required: [min_hours, max_hours, confidence]
      properties:
        min_hours:
          type: number
          minimum: 0
        max_hours:
          type: number
          minimum: 0
        confidence:
          $ref: "#/components/schemas/Confidence"
    Reward:
      type: object
      additionalProperties: false
      required: [amount, currency, evidence]
      properties:
        amount:
          type: [number, "null"]
          exclusiveMinimum: 0
        currency:
          type: [string, "null"]
          enum: [USD, null]
        evidence:
          type: array
          maxItems: 5
          items:
            type: string
    Dimensions:
      type: object
      additionalProperties: false
      required:
        - scope_clarity
        - reward_evidence
        - repository_activity
        - maintainer_responsiveness
        - technical_fit
        - competition_pressure
      properties:
        scope_clarity:
          $ref: "#/components/schemas/Score"
        reward_evidence:
          $ref: "#/components/schemas/Score"
        repository_activity:
          $ref: "#/components/schemas/Score"
        maintainer_responsiveness:
          $ref: "#/components/schemas/Score"
        technical_fit:
          $ref: "#/components/schemas/Score"
        competition_pressure:
          $ref: "#/components/schemas/Score"
    EvaluateResponse:
      type: object
      additionalProperties: false
      required:
        - request_id
        - issue
        - decision
        - score
        - confidence
        - estimated_effort
        - reward
        - dimensions
        - evidence
        - next_actions
        - limitations
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        issue:
          $ref: "#/components/schemas/IssueSummary"
        decision:
          type: string
          enum: [pursue, investigate, skip]
        score:
          $ref: "#/components/schemas/Score"
        confidence:
          $ref: "#/components/schemas/Confidence"
        estimated_effort:
          $ref: "#/components/schemas/EstimatedEffort"
        reward:
          $ref: "#/components/schemas/Reward"
        dimensions:
          $ref: "#/components/schemas/Dimensions"
        evidence:
          type: array
          maxItems: 40
          items:
            type: string
        next_actions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        limitations:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_ISSUE_URL
            - REQUEST_TOO_LARGE
            - EXAMPLE_NOT_FOUND
            - ISSUE_NOT_FOUND
            - GITHUB_RATE_LIMITED
            - UPSTREAM_TIMEOUT
            - EVALUATION_FAILED
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        retry_after_seconds:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, error]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        error:
          $ref: "#/components/schemas/ErrorDetail"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, commit]
      properties:
        status:
          type: string
          const: ok
        commit:
          $ref: "#/components/schemas/Commit"
    VerificationResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, slug, commit]
      properties:
        schemaVersion:
          type: integer
          const: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        commit:
          $ref: "#/components/schemas/Commit"
    Score:
      type: integer
      minimum: 0
      maximum: 100
    Confidence:
      type: number
      minimum: 0
      maximum: 1
    Commit:
      type: string
      pattern: "^[0-9a-fA-F]{40}$"
  examples:
    EvaluateSuccess:
      summary: Clear reward with low observed competition
      value:
        request_id: req_example_001
        issue:
          url: https://github.com/QubesOS/qubes-issues/issues/9562
          repository: QubesOS/qubes-issues
          number: 9562
          state: open
        decision: investigate
        score: 61
        confidence: 0.7
        estimated_effort:
          min_hours: 2
          max_hours: 5
          confidence: 0.72
        reward:
          amount: 50
          currency: USD
          evidence:
            - Explicit 50 USD reward found in a public issue comment.
        dimensions:
          scope_clarity: 40
          reward_evidence: 80
          repository_activity: 88
          maintainer_responsiveness: 30
          technical_fit: 50
          competition_pressure: 100
        evidence:
          - The issue contains reproducible steps and file references.
          - No assignee or implementation claim was observed.
        next_actions:
          - Confirm the acceptance and payment terms with the reward sponsor.
          - Post an implementation claim before starting substantial work.
        limitations:
          - The target repository source code was not executed.
          - Effort is a coarse estimate derived from public issue metadata, not a delivery commitment.
          - Repository language data was unavailable or empty.
    InvalidRequest:
      value:
        request_id: req_error_001
        error:
          code: INVALID_REQUEST
          message: Request body does not match the evaluation schema.
          retryable: false
    InvalidIssueUrl:
      value:
        request_id: req_error_002
        error:
          code: INVALID_ISSUE_URL
          message: Only public https://github.com issue URLs are supported.
          retryable: false
    RequestTooLarge:
      value:
        request_id: req_error_003
        error:
          code: REQUEST_TOO_LARGE
          message: Request body exceeds the 16384-byte limit.
          retryable: false
    ExampleNotFound:
      value:
        request_id: req_error_004
        error:
          code: EXAMPLE_NOT_FOUND
          message: The requested example does not exist.
          retryable: false
    IssueNotFound:
      value:
        request_id: req_error_005
        error:
          code: ISSUE_NOT_FOUND
          message: The GitHub issue is unavailable or private.
          retryable: false
    RateLimited:
      value:
        request_id: req_error_006
        error:
          code: GITHUB_RATE_LIMITED
          message: GitHub API rate limit reached. Try again later.
          retryable: true
          retry_after_seconds: 30
    UpstreamTimeout:
      value:
        request_id: req_error_007
        error:
          code: UPSTREAM_TIMEOUT
          message: GitHub did not respond within the configured time limit.
          retryable: true
    EvaluationFailed:
      value:
        request_id: req_error_008
        error:
          code: EVALUATION_FAILED
          message: The issue could not be evaluated.
          retryable: false
