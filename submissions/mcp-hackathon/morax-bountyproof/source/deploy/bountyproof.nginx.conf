limit_req_zone $binary_remote_addr zone=bountyproof_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name bountyproof.89-58-17-36.sslip.io;

    access_log /www/sites/bountyproof.89-58-17-36.sslip.io/log/access.log main;
    error_log  /www/sites/bountyproof.89-58-17-36.sslip.io/log/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bountyproof.89-58-17-36.sslip.io;

    access_log /www/sites/bountyproof.89-58-17-36.sslip.io/log/access.log main;
    error_log  /www/sites/bountyproof.89-58-17-36.sslip.io/log/error.log;

    ssl_certificate     /www/sites/bountyproof.89-58-17-36.sslip.io/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/bountyproof.89-58-17-36.sslip.io/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BOUNTYPROOF_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    client_max_body_size 16k;
    limit_req_status 429;
    limit_conn perip 10;
    limit_conn perserver 100;

    location / {
        limit_req zone=bountyproof_api burst=10 nodelay;
        limit_except GET POST OPTIONS { deny all; }

        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_request_buffering on;
        proxy_buffering on;
    }
}
