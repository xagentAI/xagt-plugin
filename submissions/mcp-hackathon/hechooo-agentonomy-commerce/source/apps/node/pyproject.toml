[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clink-node"
version = "0.1.0"
description = "Local-first runtime for Clink Agent Commerce"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "aiohttp>=3.9,<4",
  "asn1crypto>=1.5,<2",
  "boto3>=1.34,<2",
  "cryptography>=43,<47",
  "eth-account>=0.13,<1",
  "eth-hash[pycryptodome]>=0.7,<1",
  "eth-keys>=0.5,<1",
  "eth-utils>=2.3,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "mcp>=1.28,<2",
  "py-builder-relayer-client>=0.0.2",
  "py-clob-client-v2>=1.0.2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "redis>=5,<8",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[project.scripts]
clink = "clink_node.cli:main"

[tool.setuptools]
packages = [
  "clink_node",
  "clink_node.adapters",
  "clink_node.hermes",
  "clink_node.miniapp",
  "clink_node.storage",
]

[tool.setuptools.package-data]
clink_node = ["static/*"]
