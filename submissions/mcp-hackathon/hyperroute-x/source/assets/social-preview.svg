<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="pixelGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Deep Black Background -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>
  <rect width="1200" height="630" fill="url(#pixelGrid)"/>

  <!-- Subtle Accent Accents -->
  <rect x="80" y="70" width="12" height="12" fill="#FFFFFF" opacity="0.35"/>
  <rect x="104" y="94" width="12" height="12" fill="#FFFFFF" opacity="0.2"/>
  <rect x="1100" y="120" width="12" height="12" fill="#FFFFFF" opacity="0.25"/>
  <rect x="1076" y="144" width="12" height="12" fill="#FFFFFF" opacity="0.15"/>

  <!-- OKX 9-Square Grid Brand Icon -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="18" height="18" fill="#FFFFFF"/>
    <rect x="36" y="0" width="18" height="18" fill="#FFFFFF"/>
    <rect x="18" y="18" width="18" height="18" fill="#FFFFFF"/>
    <rect x="0" y="36" width="18" height="18" fill="#FFFFFF"/>
    <rect x="36" y="36" width="18" height="18" fill="#FFFFFF"/>
  </g>

  <!-- Built on X Layer Badge -->
  <g transform="translate(180, 122)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#111111" stroke="#222222" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#00D084"/>
    <text x="30" y="21" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">BUILT ON X LAYER</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="240" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    HyperRoute X
  </text>
  
  <text x="100" y="310" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">
    Deterministic Routing &amp; Pre-Flight Simulation Co-Processor
  </text>

  <!-- Subtitle Tagline -->
  <text x="100" y="360" fill="#8C8C8C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" line-height="1.5">
    Built for autonomous AI agents on X Layer (OKX L2) with zero-revert guarantees.
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(100, 420)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="310" height="110" rx="8" fill="#111111" stroke="#222222" stroke-width="1"/>
    <text x="24" y="42" fill="#00D084" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1">MULTI-POOL SPLIT</text>
    <text x="24" y="78" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Optimal Liquidity Routing</text>

    <!-- Card 2 -->
    <rect x="340" y="0" width="310" height="110" rx="8" fill="#111111" stroke="#222222" stroke-width="1"/>
    <text x="364" y="42" fill="#00D084" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1">ZERO REVERT</text>
    <text x="364" y="78" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Pre-Flight eth_call RPC</text>

    <!-- Card 3 -->
    <rect x="680" y="0" width="310" height="110" rx="8" fill="#111111" stroke="#222222" stroke-width="1"/>
    <text x="704" y="42" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1">MCP COMPLIANT</text>
    <text x="704" y="78" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Native AI Agent Tools</text>
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="100" y="585" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">
    Chain ID: 196 &bull; Uniswap V3 on X Layer &bull; Standard Model Context Protocol
  </text>
</svg>
