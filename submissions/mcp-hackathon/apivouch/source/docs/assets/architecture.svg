<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">APIVouch verified outcome architecture</title>
  <desc id="desc">An agent calls APIVouch through MCP. APIVouch enforces constraints, queries independent API providers, rejects invalid evidence, selects consensus, and stores a tamper-evident receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef8f1"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#47655a"/></marker>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif" fill="#17211d">
    <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700">One goal → independent evidence → one verified outcome</text>
    <rect x="50" y="160" width="190" height="120" rx="20" fill="#fff" stroke="#bfd7c8" stroke-width="2"/>
    <text x="145" y="207" text-anchor="middle" font-size="22" font-weight="700">AI Agent</text>
    <text x="145" y="238" text-anchor="middle" font-size="15" fill="#63716a">MCP tools/call</text>
    <path d="M240 220H330" stroke="#47655a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="340" y="110" width="330" height="220" rx="24" fill="#112b20"/>
    <text x="505" y="158" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">APIVouch</text>
    <text x="505" y="195" text-anchor="middle" fill="#9ed3b8" font-size="16">schema · cost · latency · origin</text>
    <rect x="385" y="220" width="240" height="66" rx="14" fill="#1d4936" stroke="#3a785d"/>
    <text x="505" y="248" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Consensus evidence gate</text>
    <text x="505" y="270" text-anchor="middle" fill="#b7d8c5" font-size="13">reject disagreement and failures</text>
    <path d="M670 165H760" stroke="#47655a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M670 220H760" stroke="#47655a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M670 275H760" stroke="#47655a" stroke-width="3" marker-end="url(#arrow)"/>
    <g font-size="16" font-weight="700">
      <rect x="775" y="125" width="180" height="58" rx="14" fill="#fff" stroke="#bfd7c8"/><text x="865" y="160" text-anchor="middle">Provider A</text>
      <rect x="775" y="191" width="180" height="58" rx="14" fill="#fff" stroke="#bfd7c8"/><text x="865" y="226" text-anchor="middle">Provider B</text>
      <rect x="775" y="257" width="180" height="58" rx="14" fill="#fff" stroke="#bfd7c8"/><text x="865" y="292" text-anchor="middle">Provider C</text>
    </g>
    <path d="M955 220H1010" stroke="#47655a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1020" y="145" width="140" height="150" rx="20" fill="#fff" stroke="#22a777" stroke-width="3"/>
    <text x="1090" y="190" text-anchor="middle" font-size="18" font-weight="800">VERIFIED</text>
    <text x="1090" y="222" text-anchor="middle" font-size="14" fill="#13795b">SHA-256 receipt</text>
    <text x="1090" y="250" text-anchor="middle" font-size="13" fill="#63716a">stored +</text>
    <text x="1090" y="271" text-anchor="middle" font-size="13" fill="#63716a">re-verifiable</text>
    <text x="600" y="399" text-anchor="middle" font-size="15" fill="#63716a">Normal calls require distinct public network origins, including after redirects. No LLM is needed for the deterministic evidence decision.</text>
  </g>
</svg>
