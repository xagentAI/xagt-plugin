[project]
name = "paratrix-strategy-increment"
version = "0.1.0"
description = "Reproducible simulation-only strategy increment experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
dev = ["fastapi==0.141.1", "pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
