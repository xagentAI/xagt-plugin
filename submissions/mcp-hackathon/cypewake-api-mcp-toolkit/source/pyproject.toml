[project]
name = "mcpsforge-api-mcp-toolkit"
version = "2.1.0"
description = "MCPForge · API→MCP full-chain factory: turn any OpenAPI description into MCP capabilities agents can call directly, covering Build → Verify → MCPize → Monetize"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "openapi", "fastmcp", "llm", "agent", "hackathon"]

dependencies = [
    "fastmcp>=4.0,<5.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# visual demo and /mcp endpoint
demo = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mcpsforge-verify = "verify:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# by default only run offline cases (deterministic, no network)
# for tests needing real network, run explicitly: pytest -m live -v
addopts = '-q -m "not live"'
markers = [
    "live: tests requiring real public network access (not selected by default)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
