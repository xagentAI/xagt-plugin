name: CI

# Note (declared as-is):
# This file lives inside the submission sub-directory. In this project's own standalone repo,
# placing it under the repo root's .github/workflows/ makes GitHub run it automatically.
# When nested directly inside the official submission repo's submissions/ directory,
# GitHub will not read it (Actions only scans the repo root's .github/workflows/).
# Whether or not Actions is enabled, the equivalent local commands are:
#     pip install -r requirements-dev.txt && pytest -q

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Offline tests and acceptance (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Code compiles (syntax gate)
        run: python -m compileall -q core.py server.py demo_app.py metering.py fastmcp_kwargs.py verify.py

      - name: Offline unit tests (no public network)
        run: pytest -q

      - name: Offline acceptance layer (deterministic check)
        run: |
          python - <<'PY'
          import verify
          ok = verify.verify_offline()
          raise SystemExit(0 if ok else 1)
          PY

      - name: Demo service starts and returns health check
        run: |
          pip install fastapi uvicorn
          python -m uvicorn demo_app:app --port 8765 &
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:8765/api/health > /dev/null; then
              echo "health check passed"; curl -s http://127.0.0.1:8765/api/health; exit 0
            fi
          done
          echo "health check failed"; exit 1
